<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body style="margin:0">
<title>Vaultline EDMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#fff;--surface:#fff;--muted:#fafafa;--sunken:#f2f2f2;--ink:#000;--ink-hover:#262626;
  --border:#e5e5e5;--border-subtle:#efefef;--border-strong:#d1d1d1;
  --text-strong:#000;--text:#121212;--text-2:#424242;--text-3:#757575;
  --signal:#0b63e5;--signal-subtle:#ebf3ff;
  --pos:#2f5d5a;--pos-bg:#e8f0ee;--warn:#b45309;--warn-bg:#fff7ed;--danger:#c82626;--danger-bg:#fef2f2;
  --on-ink:#fff;--info-text:#0a4fb8;--overlay:rgba(0,0,0,.35);--r:10px;--r-sm:6px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Inter Tight","Inter",sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--canvas:#0e0f11;--surface:#16171a;--muted:#121316;--sunken:#1f2125;--ink:#f2f2f2;--ink-hover:#d9d9d9;--on-ink:#0e0f11;--border:#2a2c31;--border-subtle:#222428;--border-strong:#3a3d43;--text-strong:#fff;--text:#e8e8e8;--text-2:#bdbdbd;--text-3:#8f8f8f;--signal:#5b9bff;--signal-subtle:#14233d;--info-text:#8ab8ff;--pos:#7fc4b8;--pos-bg:#14302b;--warn:#f0a35a;--warn-bg:#3a2510;--danger:#ff7a7a;--danger-bg:#3a1414;--overlay:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--canvas:#0e0f11;--surface:#16171a;--muted:#121316;--sunken:#1f2125;--ink:#f2f2f2;--ink-hover:#d9d9d9;--on-ink:#0e0f11;--border:#2a2c31;--border-subtle:#222428;--border-strong:#3a3d43;--text-strong:#fff;--text:#e8e8e8;--text-2:#bdbdbd;--text-3:#8f8f8f;--signal:#5b9bff;--signal-subtle:#14233d;--info-text:#8ab8ff;--pos:#7fc4b8;--pos-bg:#14302b;--warn:#f0a35a;--warn-bg:#3a2510;--danger:#ff7a7a;--danger-bg:#3a1414;--overlay:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{height:100%}body{height:100%;font:14px/1.5 var(--font);color:var(--text);background:var(--canvas);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
a{color:var(--signal);text-decoration:none}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
/* sidebar */
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--muted)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo{width:28px;height:28px;border-radius:7px;background:#000;display:grid;place-items:center}
.logo svg{width:16px;height:16px}
.brand b{font:700 16px var(--display);letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--text-3);font-weight:500;letter-spacing:.02em}
.nav{padding:6px 10px;flex:1;overflow:auto}
.nav h6{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--text-2);font-weight:500}
.nav a:hover{background:var(--sunken);color:var(--text)}
.nav a.active{background:var(--surface);color:var(--text-strong);box-shadow:inset 0 0 0 1px var(--border)}
.nav a svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav .count{margin-left:auto;font-size:11px;background:var(--ink);border-radius:99px;padding:0 7px;line-height:18px;color:var(--on-ink)}
.me{border-top:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;border:1px solid var(--border)}
.me select{border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:3px 6px;font-size:12px;background:var(--surface);width:100%}
.me .who{flex:1;min-width:0}.me .who div{font-weight:600;font-size:13px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px;flex:none}
.search-top{flex:1;max-width:560px;position:relative}
.search-top input{width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px 8px 34px;background:var(--muted)}
.search-top svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-3);fill:none;stroke-width:2}
.kbd{font:500 11px var(--mono);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--text-3);background:var(--surface);position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.proto{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:4px 9px;border-radius:99px;white-space:nowrap}
.bell{position:relative;width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.bell:hover{background:var(--sunken)}
.bell svg{width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:1.7}
.bell i{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--danger);border-radius:50%;border:2px solid var(--canvas)}
.view{flex:1;overflow:auto;padding:28px 32px 60px}
/* common */
h1{font:700 24px/1.2 var(--display);letter-spacing:-.02em;color:var(--text-strong)}
h2{font:600 15px var(--font);color:var(--text-strong)}
.sub{color:var(--text-3);margin-top:4px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;border:1px solid var(--border-strong);background:var(--surface);white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-hover)}
.btn.danger{color:var(--danger);border-color:#f1c4c4}
.btn.sm{padding:5px 10px;font-size:12px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.card{border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border-subtle)}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
.stat .k{font-size:12px;color:var(--text-3);font-weight:500}
.stat .v{font:700 26px var(--display);letter-spacing:-.02em;margin-top:4px}
.stat .d{font-size:12px;color:var(--text-3);margin-top:2px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--muted);white-space:nowrap}
td.mono,td.muted{white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--muted)}
tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--sunken);color:var(--text-2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.b-pos{background:var(--pos-bg);color:var(--pos)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-danger{background:var(--danger-bg);color:var(--danger)}.b-info{background:var(--signal-subtle);color:var(--signal)}
.badge.plain::before{display:none}
.ft{display:inline-grid;place-items:center;width:32px;height:38px;border-radius:5px;font:700 9px var(--mono);color:#fff;flex:none;position:relative}
.ft.pdf{background:#c82626}.ft.docx{background:#1f5bd1}.ft.xlsx{background:#1d7a4d}.ft.tif{background:#6b5b4e}.ft.png{background:#7a3fa0}.ft.msg{background:#424242}
.name{display:flex;align-items:center;gap:12px}
.name b{font-weight:600;display:block}
.name small{color:var(--text-3);font-size:12px}
.muted{color:var(--text-3)}.mono{font-family:var(--mono);font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:4px 11px;font-size:12.5px;background:var(--surface);font-weight:500}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:8px 11px;background:var(--surface)}
.input.err{border-color:var(--danger);background:var(--danger-bg)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
label.f .req{color:var(--danger)}
.field{margin-bottom:14px}
.help{font-size:11.5px;color:var(--text-3);margin-top:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--text-strong);border-color:var(--ink)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.crumbs a{color:var(--text-3)}.crumbs a:hover{color:var(--text)}
.crumbs b{color:var(--text);font-weight:600}
/* repo */
.repo{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.tree{padding:8px}
.tree div{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--text-2);font-size:13px}
.tree div:hover{background:var(--muted)}
.tree div.on{background:var(--sunken);color:var(--text-strong)}
.tree svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.tree .lock{margin-left:auto;width:12px;height:12px;opacity:.5}
.toolbar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border-subtle);flex-wrap:wrap}
.bulk{background:var(--ink);color:var(--on-ink);border-radius:8px;padding:8px 14px;display:none;align-items:center;gap:12px;margin:12px 14px 0;font-size:13px}
.bulk.show{display:flex}.bulk button{color:var(--on-ink);font-weight:600;font-size:12.5px;opacity:.85}.bulk button:hover{opacity:1}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--ink)}
/* doc view */
.docv{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.paper{background:var(--sunken);border-radius:var(--r);padding:28px;display:flex;justify-content:center;min-height:620px}
.page{background:#fff;width:100%;max-width:560px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);padding:44px 48px;font-size:12.5px;color:#222;line-height:1.7;position:relative}
.page h3{font:700 17px var(--display);margin-bottom:4px}
.page .meta{color:#777;font-size:11px;margin-bottom:22px}
.page p{margin-bottom:12px}
.page .line{height:8px;background:#eee;border-radius:3px;margin:9px 0}
.page mark{background:#fde68a;padding:0 2px}
.page .stamp{position:absolute;right:40px;top:40px;border:2px solid var(--pos);color:var(--pos);font:700 11px var(--mono);padding:4px 8px;border-radius:4px;transform:rotate(6deg);letter-spacing:.08em}
.page .sig{margin-top:30px;display:flex;gap:40px}.page .sig div{border-top:1px solid #999;padding-top:4px;font-size:10px;color:#777;width:150px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;font-size:13px}
.kv dt{color:var(--text-3)}.kv dd{font-weight:500;word-break:break-word}
.notice{display:flex;gap:10px;padding:11px 13px;border-radius:8px;font-size:12.5px;align-items:flex-start}
.notice svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;margin-top:1px}
.n-warn{background:var(--warn-bg);color:var(--warn)}.n-info{background:var(--signal-subtle);color:var(--info-text)}.n-danger{background:var(--danger-bg);color:var(--danger)}.n-pos{background:var(--pos-bg);color:var(--pos)}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--border)}
.tl{position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong)}
.tl.done::before{background:var(--pos);border-color:var(--pos)}.tl.cur::before{background:var(--warn);border-color:var(--warn)}.tl.rej::before{background:var(--danger);border-color:var(--danger)}
.tl b{font-weight:600}.tl small{display:block;color:var(--text-3);font-size:12px}
.tl .c{margin-top:6px;background:var(--muted);border:1px solid var(--border-subtle);border-radius:7px;padding:7px 10px;font-size:12.5px}
/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp .page{max-width:none;padding:28px;font-size:12px;background:var(--surface);color:var(--text);box-shadow:none;border:1px solid var(--border)}
del{background:var(--danger-bg);color:var(--danger);text-decoration:line-through}
ins{background:var(--pos-bg);color:var(--pos);text-decoration:none}
/* search */
.srch{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.facet{padding:14px 16px;border-bottom:1px solid var(--border-subtle)}
.facet:last-child{border:0}
.facet h4{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text-2)}
.facet label{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;color:var(--text-2)}
.facet label span{margin-left:auto;color:var(--text-3);font-size:12px}
.hit{padding:16px 18px;border-bottom:1px solid var(--border-subtle);cursor:pointer}
.hit:hover{background:var(--muted)}
.hit .snip{color:var(--text-2);font-size:13px;margin:6px 0 8px 44px}
.hit mark{background:#fde68a;color:#111;padding:0 1px;border-radius:2px}
.hit .tags{margin-left:44px;display:flex;gap:6px;flex-wrap:wrap}
.bigsearch{display:flex;gap:10px;margin-bottom:16px}
.bigsearch input{flex:1;font-size:15px;padding:11px 14px}
/* matrix */
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.tick{color:var(--pos);font-weight:700}.cross{color:#c4c4c4}
/* modal */
.scrim{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.scrim.show{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:480px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-h h2{font:700 17px var(--display)}
.modal-b{padding:20px 22px;overflow:auto}
.modal-f{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;align-items:center}
.x{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:18px;color:var(--text-3)}
.x:hover{background:var(--sunken)}
.drop{border:2px dashed var(--border-strong);border-radius:12px;padding:30px;text-align:center;background:var(--muted)}
.drop.over{border-color:var(--signal);background:var(--signal-subtle)}
.drop svg{width:30px;height:30px;stroke:var(--text-3);fill:none;stroke-width:1.5;margin-bottom:8px}
.upl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border-subtle)}
.bar{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .4s}
.steps{display:flex;gap:6px;font-size:11px;color:var(--text-3);margin-top:4px;flex-wrap:wrap}
.steps span.ok{color:var(--pos);font-weight:600}
.policy{background:var(--muted);border:1px solid var(--border);border-radius:9px;padding:12px 14px;font-size:12.5px;margin-bottom:16px}
.policy b{display:block;margin-bottom:4px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--on-ink);padding:11px 18px;border-radius:10px;font-weight:500;opacity:0;transition:.25s;z-index:60;display:flex;gap:10px;align-items:center;font-size:13px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;stroke:var(--pos);fill:none;stroke-width:2.4}
.hash{font:500 11px var(--mono);color:var(--text-3)}
.chain{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--pos);font-weight:600}
.chain svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2}
.code{background:#0d0d0d;color:#e5e5e5;border-radius:9px;padding:14px 16px;font:12px/1.6 var(--mono);overflow:auto;white-space:pre}
.code .k{color:#7dd3fc}.code .s{color:#86efac}.code .c{color:#737373}
.empty{text-align:center;padding:40px;color:var(--text-3)}
.hide-role{display:none!important}
@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.docv{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--border);overflow-x:auto;min-width:0}.side .brand{padding:10px 12px;flex:none}.side .brand small{display:none}.nav{display:flex;flex:none;padding:6px;gap:2px}.nav h6{display:none}.nav a{white-space:nowrap}.me{border:0;flex:none;padding:8px 12px}.me .av,.me .who div{display:none}.top .btn.primary{padding:8px 10px}.kbd{display:none}.main{min-height:0}.tabs,.card{min-width:0}.card{overflow-x:auto}.head .row{width:100%}.view{min-width:0}.docv>div,.repo>div,.srch>div{min-width:0}.paper{padding:12px;min-height:0}.page{padding:24px 18px}.page .stamp{right:14px;top:14px}.repo,.srch,.g2,.g3{grid-template-columns:1fr}.view{padding:20px 16px 50px}.top{padding:0 16px}.proto{display:none}.cmp{grid-template-columns:1fr}}

/* overview + tour */
.ov{max-width:1040px}
.ov-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:end;padding-bottom:26px;border-bottom:1px solid var(--border);margin-bottom:28px}
.ov-hero h1{font-size:34px;line-height:1.1;text-wrap:balance}
.ov-hero p{color:var(--text-2);margin-top:12px;max-width:60ch;font-size:15px}
.ov-hero .who{display:flex;gap:12px;align-items:center;margin-top:18px;font-size:13px;color:var(--text-2)}
.ov-cta{display:flex;flex-direction:column;gap:10px;background:var(--muted);border:1px solid var(--border);border-radius:12px;padding:18px}
.ov-cta b{font-size:13px}.ov-cta span{font-size:12.5px;color:var(--text-3)}
.ov h2.sec{font:700 19px var(--display);letter-spacing:-.01em;margin:34px 0 4px}
.ov p.lead{color:var(--text-3);margin-bottom:14px}
.reqs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.reqs .card{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.reqs .n{font:600 11px var(--mono);color:var(--text-3);letter-spacing:.04em}
.reqs h3{font:600 15px var(--font);color:var(--text-strong)}
.reqs ul{margin:0 0 0 16px;color:var(--text-2);font-size:13px;display:grid;gap:2px}
.reqs .row{margin-top:auto;padding-top:6px}
.tbl{overflow-x:auto}
.ms td:last-child,.ms th:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ms tfoot td{font-weight:700;border-top:1px solid var(--border)}
.tour{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:318px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.22);z-index:70;padding:16px 18px;display:none}
.tour.show{display:block}

.tour h3{font:700 16px var(--display);color:var(--text-strong);margin-bottom:4px}

.tour .do{margin-top:10px;font-size:12.5px;background:var(--muted);border:1px solid var(--border-subtle);border-radius:8px;padding:8px 10px;color:var(--text)}
.tour .do b{color:var(--text-strong)}
.tour .nav2{display:flex;gap:8px;margin-top:14px;align-items:center}
.tour-hl{outline:3px solid var(--signal)!important;outline-offset:3px;border-radius:8px;animation:pulse 1.6s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(11,99,229,.45)}100%{box-shadow:0 0 0 14px rgba(11,99,229,0)}}
@media (prefers-reduced-motion:reduce){.tour-hl{animation:none}}
.tourbtn{display:flex;align-items:center;gap:8px;margin:8px 10px 2px;padding:9px 12px;border-radius:8px;background:var(--signal);color:#fff;font-weight:600;font-size:13px;justify-content:center}
.tourbtn:hover{filter:brightness(1.08)}
@media (max-width:860px){.ov-hero{grid-template-columns:1fr}.ov-hero h1{font-size:27px}.reqs{grid-template-columns:1fr}.tour{right:16px;left:16px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}.tourbtn{margin:0 6px;white-space:nowrap;padding:7px 10px}}

<script>
/* ---------------- sample data ---------------- */

const DOCS=[
 {id:'D-10482',title:'Master Services Agreement — Northwind Logistics',ft:'pdf',folder:'leg-con',type:'Contract',dept:'Legal',ref:'CON-2026-0117',ver:'3.0',size:'2.4 MB',owner:'Omar Siddiqui',mod:'2026-10-07 16:42',status:'pending',ret:'2033-12-31',hold:false,scan:false},
 {id:'D-10477',title:'Invoice INV-88213 — Atlas Steel Ltd',ft:'tif',folder:'fin-ap',type:'Invoice',dept:'Finance',ref:'INV-88213',ver:'1.0',size:'812 KB',owner:'Hina Akhtar',mod:'2026-10-07 11:05',status:'approved',ret:'2033-10-07',hold:false,scan:true},
 {id:'D-10471',title:'Q3 2026 Management Accounts',ft:'xlsx',folder:'fin-tax',type:'Financial Report',dept:'Finance',ref:'FIN-Q3-2026',ver:'2.1',size:'1.1 MB',owner:'Sara Rahman',mod:'2026-10-06 18:20',status:'approved',ret:'2036-06-30',hold:false,scan:false},
 {id:'D-10466',title:'Employee Handbook 2026',ft:'docx',folder:'hr-pol',type:'Policy',dept:'HR',ref:'POL-HR-001',ver:'5.2',size:'640 KB',owner:'Ayesha Khan',mod:'2026-10-05 09:31',status:'changes',ret:'Permanent',hold:false,scan:false},
 {id:'D-10459',title:'Supplier Dispute — Correspondence Bundle',ft:'pdf',folder:'leg-lit',type:'Correspondence',dept:'Legal',ref:'LIT-2026-004',ver:'1.4',size:'18.7 MB',owner:'Omar Siddiqui',mod:'2026-10-04 14:12',status:'active',ret:'Hold',hold:true,scan:true},
 {id:'D-10451',title:'SOP-QA-014 Incoming Material Inspection',ft:'docx',folder:'ops-qa',type:'SOP',dept:'Operations',ref:'SOP-QA-014',ver:'4.0',size:'388 KB',owner:'Bilal Ahmed',mod:'2026-10-03 12:00',status:'approved',ret:'2031-10-03',hold:false,scan:false},
 {id:'D-10448',title:'Purchase Order PO-55102 — Kestrel Packaging',ft:'pdf',folder:'proc-po',type:'Purchase Order',dept:'Procurement',ref:'PO-55102',ver:'1.0',size:'204 KB',owner:'Zain Malik',mod:'2026-10-02 10:47',status:'rejected',ret:'2033-10-02',hold:false,scan:false},

 {id:'D-10419',title:'Customer Contract — Meridian Retail',ft:'pdf',folder:'leg-con',type:'Contract',dept:'Legal',ref:'CON-2026-0102',ver:'2.0',size:'1.3 MB',owner:'Omar Siddiqui',mod:'2026-09-24 17:01',status:'approved',ret:'2034-03-31',hold:true,scan:false},
 {id:'D-10411',title:'Site Inspection Photos — Warehouse B',ft:'png',folder:'ops-qa',type:'Inspection Record',dept:'Operations',ref:'INS-2026-077',ver:'1.0',size:'9.2 MB',owner:'Bilal Ahmed',mod:'2026-09-22 11:40',status:'active',ret:'2029-09-22',hold:false,scan:false}
];
const ST={pending:['Pending review','b-warn'],approved:['Approved','b-pos'],rejected:['Rejected','b-danger'],changes:['Changes requested','b-info'],active:['Active','']};
const USERS={admin:['Sara Rahman','SR'],records:['Faisal Qureshi','FQ'],manager:['Omar Siddiqui','OS'],user:['Hina Akhtar','HA'],viewer:['Guest Auditor','GA']};
let role='admin';
const can={
  write:()=>['admin','records','manager','user'].includes(role),
  approve:()=>['admin','manager'].includes(role),
  records:()=>['admin','records'].includes(role),
  audit:()=>['admin','records'].includes(role),
  admin:()=>role==='admin',
  hr:()=>['admin','records'].includes(role)
};
const folderName=id=>{for(const f of FOLDERS){if(f.id===id)return f.name;for(const k of f.kids)if(k.id===id)return k.name}return id};
const folderPath=id=>{for(const f of FOLDERS){for(const k of f.kids)if(k.id===id)return[f,k]}return[]};
const visibleDocs=()=>DOCS.filter(d=>can.hr()||!(d.folder.startsWith('hr')||d.folder==='leg-lit'));
const badge=s=>`<span class="badge ${ST[s][1]}">${ST[s][0]}</span>`;
const ft=t=>`<span class="ft ${t}">${t.toUpperCase().slice(0,4)}</span>`;

/* ---------------- shell ---------------- */
function renderNav(cur){
  const pend=DOCS.filter(d=>d.status==='pending').length+2;
  const items=[
    ['h','Proposal'],['overview','Your EDMS proposal','log'],
    ['h','Live demo'],['dashboard','Dashboard','dash'],['repository','Repository','folder'],['search','Search','search'],['approvals','Approvals','check',pend],
    ['h','Governance'],['records','Records & holds','archive',null,can.records],['audit','Audit log','log',null,can.audit],
    ['h','Settings'],['admin','Administration','gear',null,can.admin],['api','API & integrations','api',null,can.admin]
  ];
  document.getElementById('nav').innerHTML='<button class="tourbtn" onclick="startTour(0)">▶ Take the 3-minute tour</button>'+items.map(i=>{
    if(i[0]==='h'){const idx=items.indexOf(i);let k=idx+1,any=false;while(k<items.length&&items[k][0]!=='h'){if(!items[k][4]||items[k][4]())any=true;k++}return any?`<h6>${i[1]}</h6>`:''}
    if(i[4]&&!i[4]())return'';
    return`<a href="#${i[0]}" class="${cur===i[0]?'active':''}">${svg(i[2])}${i[1]}${i[3]?`<span class="count">${i[3]}</span>`:''}</a>`;
  }).join('');
}
function go(r){location.hash=r}
function toast(m){const t=document.getElementById('toast');t.querySelector('span').textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2600)}
function modal(html,size=''){const m=document.getElementById('modal');m.className='modal '+size;m.innerHTML=html;document.getElementById('scrim').classList.add('show')}
function closeModal(){document.getElementById('scrim').classList.remove('show')}
document.getElementById('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('qtop').focus()}});
document.getElementById('qtop').addEventListener('keydown',e=>{if(e.key==='Enter'){S.q=e.target.value||'indemnity';go('search')}});
document.getElementById('role').addEventListener('change',e=>{role=e.target.value;const u=USERS[role];document.getElementById('meName').textContent=u[0];document.getElementById('meAv').textContent=u[1];
  document.querySelectorAll('.role-write').forEach(b=>b.style.display=can.write()?'':'none');
  const r=location.hash.slice(1).split('/')[0];
  const guard={records:can.records,audit:can.audit,admin:can.admin,api:can.admin};
  if(guard[r]&&!guard[r]())go('dashboard');else route();
  toast('Viewing as '+e.target.selectedOptions[0].text+' — navigation and actions now follow that role');
});

/* ---------------- views ---------------- */
const V={};

  <div class="grid g4" style="margin-bottom:16px">

    <div class="card card-b stat"><div class="k">Awaiting my approval</div><div class="v">3</div><div class="d">1 due today</div></div>

    <div class="grid" style="align-content:start">

        <div class="card-b" style="display:grid;gap:12px">
          ${[['D-10482','Approve: MSA — Northwind Logistics','Step 2 of 3 · Due today','b-warn'],['D-10466','Review changes: Employee Handbook 2026','Requested by Ayesha Khan','b-info'],['D-10477','Sign off: Invoice INV-88213','Step 1 of 2 · Due Fri','b-warn']].map(t=>`<div class="row" style="cursor:pointer" onclick="go('doc/${t[0]}')"><span class="badge ${t[3]} plain" style="width:8px;height:8px;padding:0;border-radius:50%"></span><div style="flex:1;min-width:0"><b style="font-weight:600">${t[1]}</b><div class="muted" style="font-size:12px">${t[2]}</div></div></div>`).join('')}
        </div></div>
      <div class="card"><div class="card-h"><h2>Compliance</h2></div>
        <div class="card-b" style="display:grid;gap:10px">
          <div class="notice n-pos"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg><div><b>Audit chain verified</b> — 1,882,410 events, last check 03:00 today</div></div>
          <div class="notice n-warn"><svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0"/></svg><div><b>412 records</b> reached end of retention — awaiting disposition review</div></div>
          <div class="notice n-info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><div>Storage: 3.8 TB of 10 TB · 61% in archive tier</div></div>
        </div></div>
    </div>
  </div>`;
};

let curFolder='leg-con';
V.repository=()=>{
  const [p,k]=folderPath(curFolder);
  const docs=visibleDocs().filter(d=>d.folder===curFolder);
  const lockedNote=(p&&p.locked)?`<span class="badge plain" title="Restricted folder">${svg('lock','').replace('<svg','<svg style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2"')} Restricted · Legal + Admin</span>`:'';
  return`<div class="crumbs"><a href="#repository">Repository</a> / <a>${p?p.name:''}</a> / <b>${k?k.name:''}</b></div>
  <div class="head"><div><h1>${k?k.name:''}</h1><p class="sub">Template: <b>Department / Function</b> · Upload policy: <b>${k&&k.id==='leg-con'?'Contracts — strict':'Standard'}</b> ${lockedNote}</p></div>
    <div class="row">${can.write()?`<button class="btn" onclick="newFolder()">New folder</button><button class="btn primary" onclick="openUpload()">${svg('folder').replace('folder','')}Upload to folder</button>`:''}</div></div>
  <div class="repo">
    <div class="card tree">${FOLDERS.map(f=>{
      const hidden=f.id==='hr'&&!can.hr();
      if(hidden)return'';
      return`<div>${svg('folder')}${f.name}${f.locked?svg('lock','lock'):''}</div>`+f.kids.filter(c=>can.hr()||c.id!=='leg-lit').map(c=>`<div style="padding-left:28px" class="${c.id===curFolder?'on':''}" onclick="curFolder='${c.id}';route()">${svg('folder')}${c.name}</div>`).join('')}).join('')}
      <div style="margin-top:8px;border-top:1px solid var(--border-subtle);padding-top:12px;color:var(--text-3);font-size:12px;cursor:default">${can.hr()?'All folders visible for your role':'Some folders hidden by access control'}</div>
    </div>
    <div class="card">
      <div class="toolbar"><span class="chip on">All types</span><span class="chip">Contract</span><span class="chip">Correspondence</span><span class="chip">Amendment</span><div class="spacer"></div><span class="muted" style="font-size:12px">${docs.length} documents</span></div>
      <div class="bulk" id="bulk"><span id="bulkN">0 selected</span><div class="spacer"></div>${can.write()?'<button onclick="toast(\'Metadata updated on selected documents\')">Edit metadata</button><button onclick="toast(\'Moved — audit events written\')">Move</button>':''}${can.records()?'<button onclick="openHold()">Legal hold</button>':''}<button onclick="toast(\'ZIP export started — download will be audited\')">Download</button></div>
      ${docs.length?`<table><thead><tr><th style="width:36px"><input type="checkbox" onclick="document.querySelectorAll('.sel').forEach(c=>c.checked=this.checked);bulk()"></th><th>Name</th><th>Reference</th><th>Version</th><th>Status</th><th>Retention</th><th>Modified</th></tr></thead><tbody>
      ${docs.map(d=>`<tr class="click"><td onclick="event.stopPropagation()"><input type="checkbox" class="sel" onchange="bulk()"></td><td onclick="go('doc/${d.id}')"><div class="name">${ft(d.ft)}<div><b>${d.title}</b><small>${d.type} · ${d.size}${d.scan?' · OCR ✓':''}</small></div></div></td><td class="mono" onclick="go('doc/${d.id}')">${d.ref}</td><td onclick="go('doc/${d.id}')">v${d.ver}</td><td onclick="go('doc/${d.id}')">${badge(d.status)}</td><td onclick="go('doc/${d.id}')">${d.hold?'<span class="badge b-danger">Legal hold</span>':`<span class="muted">${d.ret}</span>`}</td><td class="muted" onclick="go('doc/${d.id}')">${d.mod.slice(0,10)}</td></tr>`).join('')}
      </tbody></table>`:`<div class="empty">No documents in this folder yet.${can.write()?' Drop files here or use Upload.':''}</div>`}
    </div>
  </div>`;
};
function bulk(){const n=document.querySelectorAll('.sel:checked').length;const b=document.getElementById('bulk');b.classList.toggle('show',n>0);document.getElementById('bulkN').textContent=n+' selected'}
function newFolder(){modal(`<div class="modal-h"><h2>New folder from template</h2><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">
  <div class="field"><label class="f">Folder template</label><select class="input"><option>Client / Matter (Legal)</option><option>Department / Year / Document Type</option><option>Vendor (Procurement)</option><option>Employee (HR) — restricted</option></select><div class="help">Templates lock the sub-folder structure, default permissions, upload policy and retention.</div></div>
  <div class="field"><label class="f">Name <span class="req">*</span></label><input class="input" value="Northwind Logistics"></div>
  <div class="policy"><b>This will create</b>Northwind Logistics / Agreements · Amendments · Correspondence · Invoices<br><span class="muted">Inherits: Legal Team (edit), Managers (read) · Policy: Contracts — strict · Retention: Contract end + 7 years</span></div></div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();toast('Folder structure created from template')">Create</button></div>`,'sm')}

/* ---------- document view ---------- */
let docTab='preview';

function addFiles(){

  document.getElementById('drop').style.display='none';

  </div></div>`).join('');
  files.forEach((f,i)=>{let p=0;const t=setInterval(()=>{p+=25;document.getElementById('bar'+i).style.width=p+'%';if(p>=100){clearInterval(t);document.getElementById('st'+i).innerHTML='<span class="ok">✓ Uploaded</span><span class="ok">✓ Hash</span><span class="ok">✓ Virus scan</span><span>Queued: extract · OCR · index</span>';checkPolicy()}},180+i*90)});

function checkPolicy(){
  const refs=[...document.querySelectorAll('.req-f')];let bad=0;
  refs.forEach(r=>{const ok=/^CON-\d{4}-\d{4}$/.test(r.value);r.classList.toggle('err',!ok);if(!ok)bad++});
  const tifBlocked=!!document.querySelector('#ulist .n-danger');
  const n=bad+(tifBlocked?1:0);
  document.getElementById('ustate').textContent=n?`${n} item(s) need attention before saving`:'All files pass the upload policy';
  document.getElementById('ustate').style.color=n?'var(--danger)':'var(--pos)';
  document.getElementById('commit').disabled=!!n;
}

let tourI=-1;
function setRole(r){const sel=document.getElementById('role');if(sel.value===r)return;sel.value=r;role=r;const u=USERS[r];document.getElementById('meName').textContent=u[0];document.getElementById('meAv').textContent=u[1];document.querySelectorAll('.role-write').forEach(b=>b.style.display=can.write()?'':'none')}

function endTour(){tourI=-1;document.getElementById('tour').classList.remove('show');document.querySelectorAll('.tour-hl').forEach(e=>e.classList.remove('tour-hl'));setRole('admin');route()}
function showStep(){
